; `php artisan serve` runs under the CLI SAPI, where opcache is disabled by
; default — every request was re-parsing and re-compiling the entire
; framework and vendor/ from scratch, which is the main cause of per-request
; latency in this setup (worse still over a Windows bind mount). Enabling it
; here, with timestamp validation on, keeps edits picking up on the next
; request while avoiding that recompile cost.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
