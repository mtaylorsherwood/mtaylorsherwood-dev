services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        ports:
            - '${APP_PORT:-8002}:8000'
            - '${VITE_PORT:-5176}:${VITE_PORT:-5176}'
        environment:
            VITE_PORT: '${VITE_PORT:-5176}'
        volumes:
            - .:/var/www/mtsdev
            - node_modules:/var/www/mtsdev/node_modules
            - vendor:/var/www/mtsdev/vendor
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:-mtsdev}'
            MYSQL_USER: '${DB_USERNAME:-mtsdev}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-secret}'
        ports:
            - '${FORWARD_DB_PORT:-3310}:3306'
        volumes:
            - db_data:/var/lib/mysql
            - ./docker/mysql-init:/docker-entrypoint-initdb.d
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${DB_ROOT_PASSWORD:-secret}']
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    node_modules:
    vendor:
    db_data:
